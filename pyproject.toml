[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dualtrade-desktop"
version = "1.9.18"
description = "DualTrade Desktop resilient local trading core"
requires-python = ">=3.13"
dependencies = [
    "cryptography==46.0.5",
    "PySide6==6.11.2",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.15.22",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/unit/_legacy"
markers = [
    "external_deriv_public: opt-in smoke tests against Deriv public read-only API",
    "external_deriv_demo: opt-in smoke tests against a Deriv demo read-only session",
    "slow: bounded local stress or soak test",
    "integration: end-to-end integration tests against real or staging services",
]


[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "strategy-lab", "apps/ui/components/_legacy", "tests/unit/_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["apps", "packages"]

[tool.setuptools.package-data]
"apps.ui.assets" = ["*.svg", "*.ico"]


[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tl-manifest-schema"
version = "1.1.0"
description = "Strategy Lab signed manifest contract"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "cryptography>=46,<47", "tl-primitives==1.0.0"]

[project.optional-dependencies]
test = ["jsonschema>=4.26,<5", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["manifest_schema*"]

[tool.setuptools.package-data]
manifest_schema = ["py.typed"]

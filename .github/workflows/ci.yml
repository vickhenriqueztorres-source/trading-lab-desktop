name: CI

on:
  push:
    branches: [ main, master, "v*" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (Desktop & Strategy Lab)
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          cd strategy-lab
          pip install -e packages/primitives
          pip install -e packages/manifest_schema
          pip install -e packages/sprt
          pip install -e .

      - name: Run Ruff Linter & Formatter (Strategy Lab)
        run: |
          cd strategy-lab
          ruff check .
          ruff format --check .

      - name: Run Mypy (Strategy Lab)
        run: |
          cd strategy-lab
          mypy --exclude build packages/primitives/primitives packages/manifest_schema/manifest_schema packages/sprt/sprt tools/strategy_lab

      - name: Run Ruff (Trading Lab Desktop)
        run: |
          ruff check apps packages tests

  untouchable-tests:
    name: Untouchable Tests (Mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Strategy Lab
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          cd strategy-lab
          pip install -e packages/primitives
          pip install -e packages/manifest_schema
          pip install -e packages/sprt
          pip install -e .

      - name: 1. Moeda (Coin Flip Approves Zero - R-RES-10)
        run: |
          cd strategy-lab
          pytest tests/test_gates_p08.py -k "test_coin_flip_approves_zero" -v

      - name: 2. Paridade de Primitivos (Parity Hash - R-ISO-2)
        run: |
          cd strategy-lab
          pytest packages/primitives/tests/parity/test_primitives_parity_hash.py -k "test_primitives_parity_hash" -v

      - name: 3. Canário de Coleta (Canary Fixture Matches - R-COL-2)
        run: |
          cd strategy-lab
          pytest tests/test_collect_p04.py -k "test_canary_fixture_matches" -v

      - name: 4. Manifestos Hostis (Hostile Manifests Rejected - R-BOT-2)
        run: |
          cd strategy-lab
          pytest packages/manifest_schema/tests/test_hostile_manifests.py -k "test_hostile_manifests_rejected" -v

      - name: 5. Integridade Temporal (DST and Current Candle Never Written - R-COL-5)
        run: |
          cd strategy-lab
          pytest tests/test_collect_p04.py -k "test_dst_and_current_candle_never_written" -v

  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Strategy Lab
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          cd strategy-lab
          pip install -e packages/primitives
          pip install -e packages/manifest_schema
          pip install -e packages/sprt
          pip install -e .

      - name: Run Strategy Lab Test Suite (Excluding Staging)
        run: |
          cd strategy-lab
          pytest -m "not staging" -v

  isolation-and-build-audit:
    name: Isolation & Build Audit (R-ISO-2..6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify Architectural Isolation in Bot
        run: |
          pytest tests/security/test_strategy_lab_isolation.py -v

      - name: Verify Secret Scrubbing
        run: |
          python scripts/scrub_secrets.py --all

  hub-deno-tests:
    name: Hub Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run Deno Typecheck
        run: |
          cd strategy-lab/apps/hub/supabase/functions
          deno check publish/index.ts outcomes/index.ts mirror/index.ts client_token/index.ts archive/index.ts tests/*.ts

      - name: Run Deno Test Suite
        run: |
          cd strategy-lab/apps/hub/supabase/functions
          deno test --allow-read=../../../../tests/fixtures,../../../../tests/keys

  staging:
    name: Staging Integration (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HAS_SUPABASE_STAGING == 'true'
    needs: [untouchable-tests, unit-and-integration]
    env:
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Staging Tests
        run: |
          cd strategy-lab
          pip install -e .
          pytest -m staging -v

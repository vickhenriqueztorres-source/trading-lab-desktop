name: CI

on:
  push:
    branches: [main, feat/enterprise-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check apps packages tests
      - run: python -m ruff format --check apps packages tests
      - run: python -m mypy apps packages
      - run: python -m compileall -q apps packages
      - run: git diff --check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [test, dependency-audit, secret-scan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Build canonical artifact when configured
        shell: pwsh
        run: |
          if (Test-Path build_scripts/compile_trading_lab.py) {
            python build_scripts/compile_trading_lab.py
          } else {
            Write-Host "Canonical build script not present; source validation remains required."
          }

  staging:
    needs: [build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Staging promotion is manual and read-only; no financial orders are enabled."
